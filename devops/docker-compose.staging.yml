services:
  db:
    image: postgres:16
    container_name: odoo-staging-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_dev
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: ${ODOO_IMAGE}
    container_name: odoo-staging
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18069:8069"
    volumes:
      - staging_odoo_data:/var/lib/odoo
      - ./devops/odoo.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/database/selector', timeout=5)"
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 30s

volumes:
  staging_postgres_data:
  staging_odoo_data:
