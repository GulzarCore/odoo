name: Deploy Odoo to EC2

on:
  workflow_run:
    workflows:
      - Odoo Docker CI
    types:
      - completed
    branches:
      - 18.0

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/odoo-deploy
          chmod 600 ~/.ssh/odoo-deploy

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Odoo
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/odoo-deploy \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" << 'EOF'

          set -e

          cd ~/odoo2/devops

          echo "Pulling latest Odoo image..."
          docker compose pull odoo

          echo "Deploying Odoo..."
          docker compose up -d --no-build odoo

          echo "Waiting for Odoo..."
          for i in $(seq 1 30); do
              if docker compose ps odoo | grep -q "healthy"; then
                  echo "Odoo is healthy."
                  break
              fi

              if [ "$i" -eq 30 ]; then
                  echo "Odoo failed health check."
                  docker compose logs --tail=100 odoo
                  exit 1
              fi

              sleep 5
          done

          echo "Deployment status:"
          docker compose ps

          echo "Deployment completed."
          EOF