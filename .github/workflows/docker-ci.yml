name: Odoo CI/CD

on:
  push:
    branches:
      - 18.0

  pull_request:
    branches:
      - 18.0

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/odoo-devops
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          tags: |
            odoo-devops:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Odoo image
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 -c "import odoo; print('Odoo import: OK')"

      - name: Test Odoo version
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 odoo-bin --version

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-test
    if: github.event_name == 'push' && needs.build-test.result == 'success'
    runs-on: ubuntu-latest

    steps:

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/odoo-deploy
          chmod 600 ~/.ssh/odoo-deploy

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/odoo-deploy \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" << 'EOF'

          set -e

          cd ~/odoo2/devops

          echo "Current image:"
          docker inspect odoo \
            --format '{{.Config.Image}}' || true

          echo "Pulling latest Odoo image..."
          docker compose pull odoo

          echo "Deploying Odoo..."
          docker compose up -d --no-build odoo

          echo "Waiting for Odoo health..."

          for i in $(seq 1 30); do

              STATUS=$(docker inspect \
                --format '{{.State.Health.Status}}' \
                odoo 2>/dev/null || echo "starting")

              echo "Health: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                  echo "Odoo is healthy."
                  break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                  echo "Odoo is unhealthy."
                  docker compose logs --tail=100 odoo
                  exit 1
              fi

              if [ "$i" -eq 30 ]; then
                  echo "Odoo health check timed out."
                  docker compose logs --tail=100 odoo
                  exit 1
              fi

              sleep 5
          done

          echo "Running containers:"
          docker compose ps

          echo "Deployed image:"
          docker inspect odoo \
            --format '{{.Config.Image}}'

          echo "Deployment successful."