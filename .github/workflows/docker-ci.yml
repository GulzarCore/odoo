
name: Odoo CI/CD

on:
  push:
    branches:
      - 18.0

  pull_request:
    branches:
      - 18.0

permissions:
  contents: read
  packages: write

concurrency:
  group: odoo-${{ github.ref }}
  cancel-in-progress: false

jobs:

  ci:
    name: Code Quality, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Code Quality - Python syntax
        run: |
          python -m compileall -q odoo addons

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/odoo-devops
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          tags: odoo-devops:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Odoo import
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 -c "import odoo; print('Odoo import: OK')"

      - name: Test Odoo version
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 odoo-bin --version

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/odoo-devops:18.0
            ghcr.io/${{ github.repository_owner }}/odoo-devops:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  staging:
    name: Deploy to Staging
    needs: ci
    if: github.event_name == 'push' && needs.ci.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -e

          SSH_DIR="$RUNNER_TEMP/ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"

          ssh-keyscan -H "$STAGING_HOST" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

          echo "SSH configuration completed."

      - name: Deploy to Staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SSH_DIR: ${{ runner.temp }}/ssh
          IMAGE: ghcr.io/${{ github.repository_owner }}/odoo-devops:sha-${{ github.sha }}
        run: |
          set -e

          echo "Deploying:"
          echo "$IMAGE"

          ssh \
            -i "$SSH_DIR/deploy_key" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$STAGING_HOST" \
            "IMAGE='$IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_READ_TOKEN='$GHCR_READ_TOKEN' bash -s" <<'REMOTE'
              set -e

              cd ~/odoo2

              echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

              docker pull "$IMAGE"

              ODOO_IMAGE="$IMAGE" \
                docker compose \
                -f devops/docker-compose.staging.yml \
                up -d

              echo "Waiting for staging health..."

              for i in $(seq 1 30); do
                STATUS=$(docker inspect \
                  --format '{{.State.Health.Status}}' \
                  odoo-staging 2>/dev/null || true)

                echo "Health: $STATUS"

                if [ "$STATUS" = "healthy" ]; then
                  echo "Staging deployment successful."
                  exit 0
                fi

                sleep 5
              done

              echo "Staging deployment failed."

              docker compose \
                -f devops/docker-compose.staging.yml \
                ps

              docker logs --tail 100 odoo-staging || true

              exit 1
REMOTE 