name: Odoo CI/CD

on:
  push:
    branches:
      - 18.0

  pull_request:
    branches:
      - 18.0

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/odoo-devops
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          tags: |
            odoo-devops:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Odoo image
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 -c "import odoo; print('Odoo import: OK')"

      - name: Test Odoo version
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 odoo-bin --version

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-test
    if: github.event_name == 'push' && needs.build-test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/odoo-deploy
          chmod 600 ~/.ssh/odoo-deploy

          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/odoo-deploy \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            ubuntu@13.233.229.141 \
            "echo SSH connection successful"

      - name: Deploy to EC2
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -i ~/.ssh/odoo-deploy \
            ubuntu@13.233.229.141 \
            "echo SSH OK"
