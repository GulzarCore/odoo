name: Odoo CI/CD

on:
  push:
    branches:
      - 18.0

  pull_request:
    branches:
      - 18.0

permissions:
  contents: read
  packages: write

concurrency:
  group: odoo-${{ github.ref }}
  cancel-in-progress: false

jobs:

  ci:
    name: Code Quality, Test and Build
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Code Quality - Python syntax
        run: |
          python -m compileall -q odoo addons

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/odoo-devops
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          tags: odoo-devops:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Odoo import
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 -c "import odoo; print('Odoo import: OK')"

      - name: Test Odoo version
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 odoo-bin --version

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Deploy to Staging
    needs: ci
    if: github.event_name == 'push' && needs.ci.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/odoo-devops:${IMAGE_TAG}"

          ssh \
            -i ~/.ssh/deploy_key \
            ubuntu@"$STAGING_HOST" \
            "export IMAGE='$IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_READ_TOKEN='$GHCR_READ_TOKEN'; bash -s" <<'REMOTE'
              set -e

              cd ~/odoo2

              git fetch origin 18.0
              git checkout 18.0
              git reset --hard origin/18.0

              echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
                -u "$GHCR_USERNAME" \
                --password-stdin

              cd ~/odoo2

              ODOO_IMAGE="$IMAGE" \
                docker compose -f devops/docker-compose.staging.yml pull

              ODOO_IMAGE="$IMAGE" \
                docker compose -f devops/docker-compose.staging.yml up -d

              echo "Waiting for Staging Odoo..."

              for i in {1..30}; do
                if docker inspect \
                  --format '{{.State.Health.Status}}' \
                  odoo-staging 2>/dev/null | grep -q healthy; then
                  echo "Staging Odoo is healthy."
                  exit 0
                fi

                sleep 5
              done

              echo "Staging health check failed."
              docker compose -f devops/docker-compose.staging.yml ps
              exit 1

