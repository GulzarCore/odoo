name: Odoo CI/CD

on:
  push:
    branches:
      - 18.0
  pull_request:
    branches:
      - 18.0

permissions:
  contents: read
  packages: write

concurrency:
  group: odoo-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gulzarcore/odoo-devops

jobs:

  ci:
    name: Code Quality, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Code Quality
        run: |
          python -m compileall -q odoo addons

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          tags: odoo-devops:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Odoo import
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 -c "import odoo; print('Odoo import: OK')"

      - name: Test Odoo version
        run: |
          docker run --rm \
            odoo-devops:test \
            python3 odoo-bin --version

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./devops/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:18.0
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Deploy to Staging
    needs: ci
    if: github.event_name == 'push' && needs.ci.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "ERROR: STAGING_HOST is empty"
            exit 1
          fi

          if [ -z "$STAGING_SSH_KEY" ]; then
            echo "ERROR: STAGING_SSH_KEY is empty"
            exit 1
          fi

          if [ -z "$GHCR_USERNAME" ]; then
            echo "ERROR: GHCR_USERNAME is empty"
            exit 1
          fi

          if [ -z "$GHCR_READ_TOKEN" ]; then
            echo "ERROR: GHCR_READ_TOKEN is empty"
            exit 1
          fi

          echo "All deployment secrets are present."
          echo "Staging host: $STAGING_HOST"
          echo "GHCR username: $GHCR_USERNAME"

      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$STAGING_SSH_KEY" > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"

          echo "Checking SSH key format..."

          ssh-keygen -y \
            -f "$SSH_DIR/deploy_key" \
            > "$SSH_DIR/deploy_key.pub"

          echo "SSH private key is valid."

          echo "Adding EC2 host key..."

          ssh-keyscan \
            -T 10 \
            -H "$STAGING_HOST" \
            > "$SSH_DIR/known_hosts"

          if [ ! -s "$SSH_DIR/known_hosts" ]; then
            echo "ERROR: Could not obtain EC2 SSH host key."
            exit 1
          fi

          chmod 600 "$SSH_DIR/known_hosts"

          echo "SSH configuration completed."

      - name: Test SSH connection
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            ubuntu@"$STAGING_HOST" \
            "echo 'SSH connection to EC2: OK'"

      - name: Deploy to Staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$STAGING_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' GHCR_READ_TOKEN='$GHCR_READ_TOKEN' IMAGE='$IMAGE' bash -s" <<'REMOTE'

          set -e

          cd ~/odoo2

          echo "Logging into GHCR..."

          echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

          echo "Pulling image:"
          echo "$IMAGE"

          docker pull "$IMAGE"

          echo "Starting staging..."

          ODOO_IMAGE="$IMAGE" \
            docker compose \
            -f devops/docker-compose.staging.yml \
            up -d

          echo "Waiting for staging health..."

          for i in $(seq 1 30); do

            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              odoo-staging 2>/dev/null || true)

            echo "Health check $i/30: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Staging deployment successful."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Staging health check failed."

          docker compose \
            -f devops/docker-compose.staging.yml \
            ps

          docker logs --tail 100 odoo-staging || true

          exit 1

          REMOTE
